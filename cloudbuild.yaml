steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/app/gmail-campaign:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/app/gmail-campaign:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - outreach
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/app/gmail-campaign:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      # The marketing site and auth entry point are public. Sensitive API,
      # task, and cron routes enforce session or OIDC authentication in-app.
      - --allow-unauthenticated
substitutions:
  _REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
